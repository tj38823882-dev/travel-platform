spring.application.name=springbootdemo

server.servlet.context-path=/
sever.port=8080
spring.mvc.hiddenmethod.filter.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

## Database
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=${DB_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=Project;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:change-me}

## JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

## Session
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=1800
server.servlet.session.cookie.name=jjkk1111
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.max-age=1800
server.servlet.session.cookie.same-site=lax

## JWT
security.jwt.secret=${JWT_SECRET:replace-with-a-long-random-secret-at-least-32-bytes}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

## LINE Pay
linepay.channel.id=${LINE_PAY_CHANNEL_ID:}
linepay.channel.secret=${LINE_PAY_CHANNEL_SECRET:}
linepay.api.url=${LINE_PAY_API_URL:https://sandbox-api-pay.line.me/v3/payments/request}
linepay.sandbox.request-url=${LINE_PAY_REQUEST_URL:https://sandbox-api-pay.line.me/v3/payments/request}
linepay.sandbox.base-url=${LINE_PAY_BASE_URL:https://sandbox-api-pay.line.me}
frontend.payment.confirm-url=${FRONTEND_PAYMENT_CONFIRM_URL:http://localhost:5173/payment/confirm}
frontend.payment.cancel-url=${FRONTEND_PAYMENT_CANCEL_URL:http://localhost:5173/payment/cancel}

## Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=profile, email

## Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

## Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
